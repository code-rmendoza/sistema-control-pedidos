{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <p class="eyebrow">Edicion</p>
    <h1>{{ title }}</h1>
  </div>
</div>
<form class="card form-card" method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <div class="actions">
    <button type="submit">{{ button }}</button>
    <a class="button secondary" href="javascript:history.back()">Volver</a>
  </div>
</form>
{% endblock %}
