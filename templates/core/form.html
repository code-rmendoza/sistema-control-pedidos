{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="topbar">
  <h1>{{ title }}</h1>
</div>
<form class="card" method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">{{ button }}</button>
</form>
{% endblock %}
