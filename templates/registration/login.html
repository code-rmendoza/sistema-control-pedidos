<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7fb; font-family: Arial, Helvetica, sans-serif; color: #172033; }
    .login { width: min(420px, 92vw); background: white; border: 1px solid #d9dee8; border-radius: 8px; padding: 26px; }
    h1 { margin: 0 0 18px; font-size: 26px; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; min-height: 40px; padding: 9px 10px; border: 1px solid #d9dee8; border-radius: 6px; }
    button { width: 100%; margin-top: 18px; min-height: 42px; border: 0; border-radius: 6px; background: #116466; color: white; font-weight: 700; cursor: pointer; }
    .error { padding: 10px 12px; background: #fee4e2; color: #b42318; border-radius: 6px; }
  </style>
</head>
<body>
  <form class="login" method="post">
    {% csrf_token %}
    <h1>Importaciones</h1>
    {% if form.errors %}<p class="error">Usuario o clave incorrectos.</p>{% endif %}
    <label for="{{ form.username.id_for_label }}">Usuario</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Clave</label>
    {{ form.password }}
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
